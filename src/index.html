<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 횡스크롤 멀티플레이어 맵 & 이동 테스트</title>
  <meta name="description" content="2D 횡스크롤 멀티플레이어 맵과 이동 동기화">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <div id="app-container">
    <!-- Game Canvas Viewport -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud-layer">
      <!-- Top Left: Quest Tracker HUD -->
      <div class="top-left-group">
        <div id="quest-tracker" class="quest-card hud-interactive">
          <div class="quest-header">📜 메인 스토리 퀘스트</div>
          <div id="quest-title" class="quest-title">🌲 숲의 서막: 오염된 수호석</div>
          <div id="quest-desc" class="quest-desc">수호의 숲 요정 루나가 용암 동굴의 마수가 깊어지고 있다고 경고합니다.</div>
        </div>
      </div>

      <!-- Top Right: Minimap -->
      <div class="top-right-group">
        <div class="minimap-card hud-interactive">
          <div class="minimap-header">
            <span id="minimap-title">🗺️ 미니맵</span>
            <button id="btn-sound-toggle" class="btn-sound-toggle">🎵 BGM ON</button>
          </div>
          <canvas id="minimap-canvas"></canvas>
        </div>
      </div>

      <!-- Controls Guide Bar -->
      <div class="controls-guide hud-interactive">
        <span>🎮 조작키: <b>A / D</b> (이동) | <b>Space</b> (점프/대화) | <b>W / S</b> (사다리) | <b>1/2/3</b> (무기/투구/갑옷 교체)</span>
      </div>

      <!-- NPC Dialog Modal -->
      <div id="dialog-modal" class="dialog-card hidden">
        <div class="dialog-portrait-box">
          <img id="dialog-portrait" src="/assets/portraits/portrait_liria.png" alt="NPC Avatar" />
        </div>
        <div class="dialog-body">
          <div id="dialog-name" class="dialog-name">🌸 섬마을 소녀 리리아</div>
          <div id="dialog-text" class="dialog-text">안녕! 여긴 파도소리가 감미로운 코랄 아일랜드야~ 🌊✨ 바다 아래 영롱한 산호 보석들을 구경해보렴!</div>
          <div id="dialog-quest-action" class="dialog-quest-action hidden">
            <button id="btn-quest-action" class="btn-quest">📜 퀘스트 수락</button>
          </div>
          <div class="dialog-hint">[Space] / [Enter] 닫기</div>
        </div>
      </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="login-modal">
      <div class="game-modal">
        <div class="modal-header">
          <span>🎮 게임 입장</span>
        </div>
        <div>
          <label style="font-size: 12px; color: #a0aec0;">플레이어 닉네임</label>
          <input type="text" id="login-nickname" class="form-input" placeholder="닉네임을 입력하세요 (기본: 모험가)">
          <button class="btn-primary" id="btn-start-game">게임 시작 🚀</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
